name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag upstream, so pin exactly
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check .

      # Both suites are plain scripts that exit non-zero on failure, so the published contracts
      # live in Python where they can assert exact values. This step used to grep the parser's
      # human-readable summary for four numbers, which accepted any value whose decimal expansion
      # began with the pinned digits ("74" matches "740") and matched "4,790" anywhere in the
      # output, including a per-tier subtotal.
      - name: Validate the estimator against Glickman's worked example
        run: ./tests/test_glicko2.py

      - name: Assert the published skill-tree inventory
        run: ./tests/test_parse_tree.py

      - name: Build the reading view of docs/METHOD.md
        # Checks docs/assets/ on the way: balanced braces in style.css, and node --check plus the
        # character-class guard on app.js — both against the files that actually ship. A parse
        # error in the script silently disables the whole page, so it must fail the build.
        run: ./docs/build.py --out /tmp/method.html

      - name: Smoke-run the experiments
        run: |
          ./src/recovery.py --quick --out /tmp/recovery.png
          ./src/batch_fit.py --quick --puzzles 120 --players 1200

      # The scripts are advertised as runnable standalone — no checkout, no project environment —
      # through their PEP 723 inline headers. That path resolves a different dependency set than
      # `uv sync`, so it gets its own check rather than being assumed to work.
      - name: Run a script standalone, outside the project environment
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/src" "$work/tests"
          cp src/glicko2.py "$work/src/"
          cp tests/test_glicko2.py "$work/tests/"
          cd "$work" && ./tests/test_glicko2.py

      - uses: actions/upload-artifact@v7
        with:
          name: method-html
          path: /tmp/method.html
          if-no-files-found: error
